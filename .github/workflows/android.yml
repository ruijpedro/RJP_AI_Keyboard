name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # IMPORTANT: do not merge the full Hunspell packages into the APK here.
      # The complete dictionaries are published by update-dictionaries.yml and
      # downloaded safely at runtime. Keeping starter dictionaries in the APK
      # makes startup predictable and avoids large in-memory indexes.
      - name: Build debug APK with automatic dictionary feed
        env:
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          MANIFEST_URL="https://raw.githubusercontent.com/${REPO}/${DEFAULT_BRANCH}/dictionary-feed/manifest.json"
          gradle :app:assembleDebug --stacktrace -PDICTIONARY_MANIFEST_URL="$MANIFEST_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP-AI-Keyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
