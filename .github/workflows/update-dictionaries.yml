name: Update Runtime Dictionaries

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enrich dictionaries from open Hunspell packages
        run: bash tools/enrich_dictionaries.sh

      - name: Publish validated dictionary feed
        run: python3 tools/publish_dictionary_feed.py

      - name: Commit dictionary feed when it changed
        run: |
          if git diff --quiet -- dictionary-feed; then
            echo "No dictionary changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionary-feed
          git commit -m "chore: update runtime dictionaries"
          git push
